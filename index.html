<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #d6336c;
        }
        #note {
            font-size: 24px;
            margin-top: 40px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 600px;
        }
    </style>
</head>
<body>

<h1>Daily Love Note 💌</h1>
<div id="note">Loading today's message...</div>

<script>
const messages = [
"Happy 2nd anniversary amor!! I can’t help but smile thinking about how far we’ve come and how close we are to the life we’re building together. In just one more year, I get to call you my wife, and that makes me happier than you will ever know. Every day with you is a gift, and every day I fall in love with you all over again. See you tonight love!!",

"Sometimes I catch myself replaying little moments we’ve shared — random laughs, quiet conversations, the way we look at each other without saying anything — and I realize those are the memories that mean the most to me. You’ve turned ordinary days into something I’ll cherish forever just by being there with me.",

"I love the way you see the world and how you’ve helped me see it differently too. Your kindness, your patience, and the warmth you bring into every room make me proud to stand beside you. You make me want to be a better person, not because you ask me to, but because you inspire me to be.",

"There’s a comfort I feel with you that I’ve never known before — like no matter what happens, as long as we’re together, everything will be okay. Being with you feels like home in the truest sense of the word, and that’s something I’m endlessly grateful for.",

"I admire so many things about you, but one of my favorites is how you care so deeply for the people around you. The way you love, the way you listen, and the way you give so much of yourself so freely reminds me every day how lucky I am to be loved by you.",

"Even on the simplest days, when nothing particularly exciting happens, I still find myself feeling incredibly happy just because I get to share my life with you. Your presence alone is enough to make any day brighter, calmer, and more meaningful.",

"When I think about our future — the adventures we’ll have, the challenges we’ll overcome, and the quiet evenings we’ll spend side by side — I feel an overwhelming sense of peace and excitement. No matter where life takes us, I know that as long as I’m with you, I’m exactly where I’m meant to be."
];

const today = new Date();
const start = new Date(2026, 4, 19); // May = 4

function toMidnight(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

const oneDay = 1000 * 60 * 60 * 24;

const daysPast = Math.floor(
  (toMidnight(today) - toMidnight(start)) / oneDay
);

let index = daysPast;
if (index < 0) index = 0;
if (index >= messages.length) index = messages.length - 1;

document.getElementById("note").innerText = messages[index];
</script>

</body>
</html>
